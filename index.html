
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Profile</title>
<style>
  :root{
    --bg:#050505; --panel:#161616; --panel2:#1f1f1f; --line:#2a2a2a;
    --text:#f2f2f2; --muted:#9a9a9a; --accent:#3fb950;
    --l0:#202020; --l1:#0e4429; --l2:#006d32; --l3:#26a641; --l4:#5ee06f;
    --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{background:#e2e2e2;font-family:var(--font);color:var(--text);padding:24px;min-height:100vh}
  a{color:inherit}
  .app{background:var(--bg);border-radius:28px;padding:20px;display:grid;grid-template-columns:56px 300px 1fr;gap:20px;max-width:1500px;margin:0 auto}
  .rail{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px}
  .rail svg{width:40px;height:40px;fill:#fff}
  .rail img{width:36px;height:36px;border-radius:50%;margin-top:auto}
  .rail .burger{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:18px}
  .card{background:var(--panel);border:1px solid #1d1d1d;border-radius:24px;padding:28px}
  .side{display:flex;flex-direction:column;gap:6px;min-height:640px}
  .side h1{font-size:26px;font-weight:500}
  .side .login{color:var(--muted);font-size:17px;margin-bottom:14px}
  .side nav a{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px;text-decoration:none;font-size:17px}
  .side nav a.on{background:var(--panel2)}
  .pill{background:#2c2c2c;border-radius:20px;font-size:12px;padding:3px 9px;color:#ccc}
  .meta{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:14px;font-size:14px;color:#cfcfcf}
  .meta div{overflow-wrap:anywhere}
  .counts{border-top:1px solid var(--line);padding-top:16px;font-size:15px;color:var(--muted)}
  .counts b{color:var(--text);font-weight:400}
  .follow{display:block;text-align:center;border:1px solid #fff;border-radius:10px;padding:14px;text-decoration:none;font-size:17px;margin-top:10px}
  .follow:hover{background:#fff;color:#000}
  .main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:20px;align-content:start}
  .photo{aspect-ratio:1;border-radius:24px;overflow:hidden;border:1px solid #1d1d1d;background:var(--panel)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .readme .path{font:12px ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:22px}
  .readme h2{font-size:30px;font-weight:500;margin-bottom:18px}
  .readme .body{font-size:15.5px;line-height:1.75;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;padding-right:6px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-content:start}
  .stat b{display:block;font-size:34px;font-weight:500}
  .stat span{color:var(--muted);font-size:14px}
  .langs h3,.contrib h3,.repos h3{font-size:20px;font-weight:500;margin-bottom:18px}
  .bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-bottom:16px;background:var(--l0)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;color:#cfcfcf}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .contrib{grid-column:2}
  .contrib h3{font-size:28px}
  .scroll{overflow-x:auto;padding-bottom:6px}
  .grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:4px;width:max-content;margin-top:8px}
  .grid i{border-radius:3px;background:var(--l0)}
  .months{position:relative;height:18px;font-size:12.5px;color:#ddd;margin-top:6px}
  .months span{position:absolute}
  .repos{grid-column:1 / -1}
  .repolist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .repo{background:var(--panel2);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;text-decoration:none;min-height:170px}
  .repo:hover{outline:1px solid #444}
  .repo strong{font-size:17px;font-weight:500;overflow-wrap:anywhere}
  .repo p{color:#bbb;font-size:14.5px;line-height:1.5;flex:1}
  .repo .foot{display:flex;gap:16px;font-size:14px;color:#ccc;flex-wrap:wrap}
  .tag{font-size:11px;border:1px solid #555;border-radius:20px;padding:2px 8px;color:#aaa;margin-left:8px;white-space:nowrap}
  .tag.arch{border-color:#bfa600;color:#e6d34a}
  .picker{display:flex;gap:10px;max-width:1500px;margin:0 auto 16px}
  .picker input{flex:1;max-width:320px;padding:12px 14px;border-radius:10px;border:1px solid #bbb;font:inherit}
  .picker button{padding:12px 20px;border-radius:10px;border:0;background:#111;color:#fff;font:inherit;cursor:pointer}
  .msg{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:1100px){
    .app{grid-template-columns:1fr}
    .rail{flex-direction:row;padding:0}.rail img{margin:0 0 0 auto}
    .main{grid-template-columns:1fr}.contrib{grid-column:1}
    .side{min-height:0}
  }
</style>
</head>
<body>
<form class="picker" id="pick">
  <input id="user" placeholder="GitHub username" aria-label="GitHub username" autocomplete="off">
  <button>Load profile</button>
</form>

<div class="app" id="app">
  <div class="msg">Enter your GitHub username above to load your profile.</div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,"") + "k" : n;
const COLORS = ["#3fb950","#58a6ff","#d2a8ff","#f0883e","#ff7b72","#e3b341","#79c0ff","#a5d6ff"];

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(r.status === 404 ? "User not found" : r.status === 403 ? "GitHub rate limit reached. Try again in an hour" : "Request failed (" + r.status + ")");
  return r.json();
}

async function load(name){
  const app = $("#app");
  app.innerHTML = '<div class="msg">Loading ' + esc(name) + '…</div>';
  try{
    const [u, repos] = await Promise.all([
      getJSON("https://api.github.com/users/" + encodeURIComponent(name)),
      getJSON("https://api.github.com/users/" + encodeURIComponent(name) + "/repos?per_page=100&sort=pushed")
    ]);
    const [readme, contribs] = await Promise.all([
      fetch(`https://raw.githubusercontent.com/${u.login}/${u.login}/HEAD/README.md`).then(r => r.ok ? r.text() : null).catch(() => null),
      fetch(`https://github-contributions-api.jogruber.de/v4/${u.login}?y=last`).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    render(u, repos, readme, contribs);
    try{ history.replaceState(null, "", "?u=" + encodeURIComponent(u.login)); }catch(e){}
  }catch(e){
    app.innerHTML = '<div class="msg">' + esc(e.message) + '. Check the username and try again.</div>';
  }
}

function render(u, repos, readme, contribs){
  const own = repos.filter(r => !r.fork);
  const stars = own.reduce((a, r) => a + r.stargazers_count, 0);
  const top = [...own].sort((a,b) => b.stargazers_count - a.stargazers_count).slice(0,6);

  const lc = {};
  own.forEach(r => { if(r.language) lc[r.language] = (lc[r.language]||0) + 1; });
  const langs = Object.entries(lc).sort((a,b) => b[1]-a[1]).slice(0,8);
  const total = langs.reduce((a,l) => a + l[1], 0) || 1;

  let intro = readme ? readme
    .replace(/<!--[\s\S]*?-->/g,"").replace(/<[^>]+>/g,"")
    .replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
    .replace(/^#+\s*/gm,"").replace(/[*_`]/g,"").trim() : "";
  if(!intro) intro = u.bio || "No bio yet.";

  const meta = [
    u.company && ["🏢", u.company],
    u.email && ["✉️", u.email],
    u.location && ["📍", u.location],
    u.blog && ["🔗", u.blog],
    u.twitter_username && ["𝕏", "@" + u.twitter_username]
  ].filter(Boolean).map(([i,t]) => `<div>${i}&nbsp; ${esc(t)}</div>`).join("");

  let contribHTML = '<p style="color:var(--muted)">Contribution data is unavailable right now.</p>', totalC = 0;
  if(contribs && contribs.contributions && contribs.contributions.length){
    const days = contribs.contributions;
    totalC = Object.values(contribs.total || {}).reduce((a,b)=>a+b,0);
    const pad = new Date(days[0].date + "T00:00:00").getDay();
    let cells = "<i style='visibility:hidden'></i>".repeat(pad);
    let months = "", lastM = -1;
    days.forEach((d, i) => {
      const dt = new Date(d.date + "T00:00:00");
      const col = Math.floor((i + pad) / 7);
      if(dt.getMonth() !== lastM && (i === 0 || dt.getDate() <= 7)){
        months += `<span style="left:${col*16}px">${dt.toLocaleString("en",{month:"short"})}</span>`;
        lastM = dt.getMonth();
      }
      cells += `<i title="${d.count} contributions on ${d.date}" style="background:var(--l${d.level})"></i>`;
    });
    contribHTML = `<div class="scroll"><div class="months" style="width:${Math.ceil((days.length+pad)/7)*16}px">${months}</div><div class="grid">${cells}</div></div>`;
  }

  $("#app").innerHTML = `
  <aside class="rail">
    <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    <div class="burger">☰</div>
    <img src="${esc(u.avatar_url)}&s=72" alt="">
  </aside>

  <aside class="card side">
    <h1>${esc(u.name || u.login)}</h1>
    <div class="login">${esc(u.login)}</div>
    <nav>
      <a class="on" href="${esc(u.html_url)}">Overview</a>
      <a href="${esc(u.html_url)}?tab=repositories">Repositories <span class="pill">${u.public_repos}</span></a>
      <a href="${esc(u.html_url)}?tab=projects">Projects</a>
      <a href="${esc(u.html_url)}?tab=packages">Packages</a>
      <a href="${esc(u.html_url)}?tab=stars">Stars <span class="pill">${fmt(stars)}</span></a>
    </nav>
    <div class="meta">${meta}
      <div class="counts"><b>${fmt(u.followers)}</b> followers · <b>${fmt(u.following)}</b> following</div>
    </div>
    <a class="follow" href="${esc(u.html_url)}">Follow</a>
  </aside>

  <section class="main">
    <div class="photo"><img src="${esc(u.avatar_url)}&s=600" alt="${esc(u.login)}"></div>
    <div class="card readme">
      <div class="path">${esc(u.login)} / README.md</div>
      <h2>Howdy!</h2>
      <div class="body">${esc(intro)}</div>
    </div>

    <div class="card stats">
      <div class="stat"><b>${u.public_repos}</b><span>Public repositories</span></div>
      <div class="stat"><b>${fmt(stars)}</b><span>Stars earned</span></div>
      <div class="stat"><b>${u.public_gists}</b><span>Gists</span></div>
      <div class="stat"><b>${new Date(u.created_at).getFullYear()}</b><span>Joined GitHub</span></div>
    </div>

    <div class="card contrib">
      <h3>${totalC ? totalC.toLocaleString() + " contributions in the last year" : "Contributions in the last year"}</h3>
      ${contribHTML}
    </div>

    <div class="card langs" style="grid-column:1">
      <h3>Top languages</h3>
      <div class="bar">${langs.map((l,i)=>`<div title="${esc(l[0])}" style="width:${l[1]/total*100}%;background:${COLORS[i]}"></div>`).join("")}</div>
      <div class="legend">${langs.map((l,i)=>`<span><span class="dot" style="background:${COLORS[i]}"></span>${esc(l[0])} ${Math.round(l[1]/total*100)}%</span>`).join("") || "No language data."}</div>
    </div>

    <div class="card repos">
      <h3>Popular repositories</h3>
      <div class="repolist">${top.map(r => `
        <a class="repo" href="${esc(r.html_url)}">
          <strong>${esc(r.name)}<span class="tag ${r.archived?"arch":""}">${r.archived ? "Public Archive" : "Public"}</span></strong>
          <p>${esc(r.description || "No description provided.")}</p>
          <div class="foot"><span>☆ ${fmt(r.stargazers_count)}</span><span>⑂ ${fmt(r.forks_count)}</span>${r.language ? `<span>${esc(r.language)}</span>` : ""}</div>
        </a>`).join("") || '<p style="color:var(--muted)">No public repositories yet.</p>'}
      </div>
    </div>
  </section>`;
  document.title = (u.name || u.login) + " · GitHub";
}

$("#pick").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#user").value.trim().replace(/^@/,"");
  if(v) load(v);
});
const q = new URLSearchParams(location.search).get("u");
if(q){ $("#user").value = q; load(q); }
</script>
</body>
</html>
